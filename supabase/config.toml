# STAGING PROBE ONLY: custom event-scoped guest token is the authorization.
[functions.guest-token-probe]
verify_jwt = false

# Reviewed staging integration: handlers validate Auth or service-validated guest proof.
[functions.guest-event]
verify_jwt = false
[functions.guest-event-stream]
verify_jwt = false
[functions.music-search]
verify_jwt = false
[functions.tip-create-checkout]
verify_jwt = false

# Bridge Pairing Protocol v2: called by the desktop app, which has no user JWT. The handlers
# authenticate at the application layer before any protected action: bridge-pair by the 80-bit
# one-time pairing code (the client nonce only makes a retry idempotent; it is not authentication),
# bridge-revoke by the current ingest token.
# UNRESOLVED DEPLOYMENT GATE: a public verify_jwt=false pairing endpoint needs independently
# verified trusted gateway/platform request limiting before deployment. See the protocol contract.
[functions.bridge-pair]
verify_jwt = false

[functions.bridge-revoke]
verify_jwt = false
